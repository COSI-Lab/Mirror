server {
    listen [::]:80 default_server;
    listen 80 default_server;

    resolver 127.0.0.11;

    server_name _ ${DNS_BASENAME};

    # redirect root to home
    location = / {
        return 301 /home;
    }

    # default location is /storage
    location / {
        root /storage;
        autoindex on;
    }

    # static site pages
    location ~* ^/(about|home|map) {
        xslt_stylesheet /etc/nginx/xslt/base.xslt;
        xslt_types text/html;
        root /var/www/static/pages;
        try_files $uri $uri.html 404;
    }

    location = /projects {
        root /storage;
        rewrite ^/projects / break;
        autoindex on;
        autoindex_format xml;
        xslt_stylesheet /etc/nginx/xslt/projects.xslt;
        xslt_stylesheet /etc/nginx/xslt/base.xslt;
        add_header content-type text/html;
    }

    # static website resources
    location ^~ /static {
        # because of nginx rules, this implies /var/www/static
        root /var/www;
        try_files $uri $uri.png $uri.jpg $uri.svg $uri.ico $uri.html $uri.js $uri.css 404;
    }
}
