#
# compose.yml
# https://git.cosi.clarkson.edu/mirror/mirror
#

name: mirror
services:
  # --- Sync Scheduler ---
  sync:
    build: ./module/sync
    container_name: sync
    expose:
      - ${SYNC_MANUAL_SYNC_PORT}
    restart: unless-stopped
    environment:
      - DRY_RUN=${SYNC_DRY_RUN}
      - SPDLOG_LEVEL=${SYNC_SPDLOG_LEVEL}
      - MANUAL_SYNC_PORT=${SYNC_MANUAL_SYNC_PORT}
    volumes:
      - "${MIRROR_STORAGE}:/storage"
      - "./config:/mirror/config:ro"
      - "./script:/mirror/script:ro"
      - /var/log/mirror:/mirror/error-logs
    networks:
      - mirror
  # --- Web Proxy ---
  proxy:
    build: ./modules/proxy
    container_name: proxy
    ports:
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
      - "[::]:443:443"
      - "[::]:80:80"
    restart: unless-stopped
    volumes:
      - "${MIRROR_STORAGE}:/storage:ro"
    environment:
      - DNS_BASENAME=${MIRROR_DNS_BASENAME}
    networks:
      - mirror
      - loki
  # --- rsyncd Host ---
  rsyncd:
    build: ./module/rsyncd
    container_name: rsyncd
    ports:
      - "0.0.0.0:873:873"
      - "[::]:873:873"
    restart: unless-stopped
    volumes:
      - "./config/sync/configs/mirrors.json:/mirrors.json:ro"
      - "${MIRROR_STORAGE}:/storage"
    networks:
      - mirror
  # --- Map API ---
  map:
    build: ./module/map
    container_name: map
    expose:
      - 8080
    restart: unless-stopped
    environment:
      - LOGLEVEL=${MAP_LOG_LEVEL}
    volumes:
      - "./config/sync/configs/mirrors.json:/map/mirrors.json:ro"
    networks:
      - mirror
      - loki
  # --- Monitoring stack (Loki + Grafana + Alloy) ---
  alloy:
    build: ./modules/alloy
    container_name: alloy
    expose:
      - 4317
      - 4318
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - loki
  loki:
    build: ./module/loki
    container_name: loki
    expose:
      - 3100
    networks:
      - loki
  grafana:
    build: ./modules/grafana
    container_name: grafana
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=grafanaManagedRecordingRules
      - GF_AUTH_BASIC_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app 1.0.39
      - GF_SERVER_ROOT_URL=https://${MIRROR_DNS_BASENAME}/grafana/
    expose:
      - 3000
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - loki

networks:
  mirror:
    enable_ipv6: true
  loki:

volumes:
  grafana: {}
